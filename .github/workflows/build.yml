name: Build Quid CLI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Build
        run: npm run build

      # This step automatically commits the 'dist' folder back to your GitHub repo!
      - name: Commit Compiled Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-build dist folder via GitHub Actions"
          file_pattern: "dist/*"
